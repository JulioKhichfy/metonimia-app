# Produção: docker compose up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: metonimia
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d metonimia"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/metonimia
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      APP_UPLOAD_DIR: /data/uploads
      APP_PRIVADO_DIR: /data/privado        # fotos de intérpretes: NÃO é montado no Caddy (só sai pela API, com login)
      # E-mail para mensagens aos intérpretes (vazio = envio de e-mail desligado)
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_REMETENTE: ${MAIL_REMETENTE:-assessoria@metonimia.com.br}
      MENSAGEM_COPIA_EMAIL: ${MENSAGEM_COPIA_EMAIL:-assessoria@metonimia.com.br}
    volumes:
      - uploads:/data/uploads
      - privado:/data/privado

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:                                  # e-mail e WhatsApp do site (gravados no build; mudou? docker compose up -d --build web)
        CONTATO_EMAIL: ${CONTATO_EMAIL:-assessoria@metonimia.com.br}
        CONTATO_WHATSAPP: ${CONTATO_WHATSAPP:-+55 21 99896-1769}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      REDIRECT_DOMAINS: ${REDIRECT_DOMAINS}
    volumes:
      - uploads:/srv-uploads:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  privado:
  caddy_data:
  caddy_config:
