<div class="admin">
  <mat-toolbar class="admin-barra">
    <a routerLink="/admin" class="admin-marca" aria-label="Início do painel">
      <img src="imagens/logo_img.png" alt="" width="420" height="280" />
      <span>Painel</span>
    </a>
    <nav class="admin-nav" aria-label="Seções do painel">
      <a mat-button routerLink="/admin/palestras" routerLinkActive="ativo">PALESTRAS</a>
      <a mat-button routerLink="/admin/eventos" routerLinkActive="ativo">EVENTOS</a>
      <a mat-button routerLink="/admin/servicos" routerLinkActive="ativo">SERVIÇOS</a>
      <a mat-button routerLink="/admin/interpretes" routerLinkActive="ativo">INTÉRPRETES</a>
    </nav>
    <span class="espaco"></span>
    <a mat-button href="/" target="_blank" rel="noopener"><mat-icon>open_in_new</mat-icon> Ver site</a>
    <button mat-button type="button" (click)="auth.sair()"><mat-icon>logout</mat-icon> Sair</button>
  </mat-toolbar>
  <main class="admin-conteudo">
    <router-outlet />
  </main>
</div>
