<h1>Gerenciador de conteúdo</h1>
<p class="admin-intro">Escolha o que deseja atualizar no site.</p>
<div class="dash-botoes">
  <a routerLink="/admin/palestras" class="dash-botao">
    <mat-icon aria-hidden="true">record_voice_over</mat-icon>
    <span class="dash-titulo">PALESTRAS</span>
    <span class="dash-texto">Criar, editar e excluir palestras</span>
  </a>
  <a routerLink="/admin/eventos" class="dash-botao">
    <mat-icon aria-hidden="true">event</mat-icon>
    <span class="dash-titulo">EVENTOS</span>
    <span class="dash-texto">Criar, editar e excluir eventos</span>
  </a>
  <button type="button" class="dash-botao" (click)="baixarBackup()" [disabled]="baixando()">
    <mat-icon aria-hidden="true">{{ baixando() ? 'hourglass_top' : 'backup' }}</mat-icon>
    <span class="dash-titulo">BACKUP</span>
    <span class="dash-texto">
      {{ baixando() ? 'Gerando backup…' : 'Baixar uma cópia do banco de dados (palestras e eventos)' }}
    </span>
  </button>
</div>
@if (status(); as s) {
  <p class="dash-status" [class.erro]="s.erro" role="status">{{ s.texto }}</p>
}
